<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🇨🇳 Voyage Chine — Nov 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --red:    #C0392B;
  --gold:   #D4A843;
  --ink:    #1A1208;
  --paper:  #F5F0E8;
  --warm:   #EDE8DC;
  --smoke:  #7A7060;
  --white:  #FDFAF5;
  --card:   rgba(255,252,245,0.92);
  --shadow: 0 4px 24px rgba(26,18,8,0.13);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── COVER ─────────────────────────────── */
#cover {
  min-height: 100dvh;
  background: var(--ink);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  padding: 32px 24px 48px;
}

.cover-pattern {
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(45deg, rgba(212,168,67,.06) 0, rgba(212,168,67,.06) 1px, transparent 0, transparent 50%),
    repeating-linear-gradient(-45deg, rgba(192,57,43,.04) 0, rgba(192,57,43,.04) 1px, transparent 0, transparent 50%);
  background-size: 32px 32px;
}

.cover-circle {
  position: absolute;
  width: 420px; height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(192,57,43,.18) 0%, transparent 70%);
  top: -80px; right: -100px;
}
.cover-circle2 {
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,168,67,.12) 0%, transparent 70%);
  bottom: 20px; left: -80px;
}

.cover-content { position: relative; z-index: 1; text-align: center; max-width: 380px; }

.cover-flag { font-size: 56px; margin-bottom: 12px; display: block; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

.cover-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 500; letter-spacing: 3px;
  color: var(--gold); text-transform: uppercase; margin-bottom: 16px;
}

.cover-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px, 10vw, 52px);
  font-weight: 700; color: var(--white);
  line-height: 1.1; margin-bottom: 8px;
}
.cover-title span { color: var(--gold); font-style: italic; }

.cover-sub {
  font-size: 14px; color: rgba(253,250,245,.55);
  margin-bottom: 32px; font-weight: 300;
}

.trip-stats {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 1px; background: rgba(255,255,255,.08);
  border-radius: 12px; overflow: hidden;
  margin-bottom: 36px;
}
.stat {
  background: rgba(255,255,255,.04);
  padding: 14px 8px; text-align: center;
}
.stat-num { font-size: 22px; font-weight: 700; color: var(--gold); display: block; }
.stat-label { font-size: 10px; color: rgba(253,250,245,.45); text-transform: uppercase; letter-spacing: 1px; }

.route-pills {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-bottom: 40px;
}
.pill {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 100px; padding: 6px 14px;
  font-size: 12px; color: rgba(253,250,245,.7);
  display: flex; align-items: center; gap: 6px;
}
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

.btn-start {
  background: var(--red);
  color: white; border: none;
  padding: 16px 40px; border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 500;
  cursor: pointer; letter-spacing: 0.5px;
  box-shadow: 0 8px 32px rgba(192,57,43,.4);
  transition: transform .2s, box-shadow .2s;
}
.btn-start:active { transform: scale(.97); box-shadow: 0 4px 16px rgba(192,57,43,.4); }

/* ── APP SHELL ─────────────────────────── */
#app { display: none; flex-direction: column; min-height: 100dvh; }

/* TOP NAV */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--ink);
  padding: 14px 20px 10px;
  display: flex; align-items: center; gap: 12px;
}
.topbar-back {
  background: rgba(255,255,255,.08); border: none;
  width: 36px; height: 36px; border-radius: 50%;
  color: white; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.topbar-city {
  flex: 1;
  font-family: 'Playfair Display', serif;
  font-size: 17px; color: white; font-weight: 700;
}
.topbar-date { font-size: 11px; color: var(--gold); font-weight: 500; letter-spacing: .5px; }

/* CITY SELECTOR */
#city-view { display: none; }
#city-view.active { display: block; }

.city-header {
  position: relative; overflow: hidden;
  min-height: 200px;
  display: flex; flex-direction: column;
  justify-content: flex-end; padding: 24px 20px 20px;
}
.city-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: brightness(.55);
}
.city-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 30%, rgba(26,18,8,.85));
}
.city-header-content { position: relative; z-index: 1; }
.city-emoji { font-size: 36px; }
.city-name {
  font-family: 'Playfair Display', serif;
  font-size: 32px; font-weight: 700; color: white;
  line-height: 1;
}
.city-dates { font-size: 13px; color: rgba(255,255,255,.65); margin-top: 4px; }

.city-weather-bar {
  background: var(--ink); color: white;
  padding: 14px 20px;
  display: flex; gap: 20px; align-items: center;
  font-size: 13px;
}
.weather-temp { font-size: 20px; font-weight: 700; color: var(--gold); }
.weather-desc { color: rgba(255,255,255,.6); font-size: 12px; }
.weather-tips { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 2px; }

/* DAYS LIST */
.days-list { padding: 16px 16px 100px; display: flex; flex-direction: column; gap: 10px; }

.day-card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
  border: 1px solid rgba(26,18,8,.06);
}
.day-card:active { transform: scale(.985); }

.day-card-header {
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.day-num {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--ink); color: var(--gold);
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.day-num.tampon { background: var(--smoke); }
.day-card-info { flex: 1; }
.day-card-title { font-size: 14px; font-weight: 500; }
.day-card-meta { font-size: 11px; color: var(--smoke); margin-top: 2px; }
.day-card-tag {
  font-size: 10px; padding: 3px 8px; border-radius: 100px;
  font-weight: 500;
}
.tag-tampon { background: rgba(122,112,96,.12); color: var(--smoke); }
.tag-visite { background: rgba(192,57,43,.1); color: var(--red); }
.tag-excursion { background: rgba(212,168,67,.15); color: #8B6914; }

.day-card-preview {
  padding: 0 16px 14px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.preview-pill {
  font-size: 11px; color: var(--smoke);
  background: var(--warm); padding: 3px 8px;
  border-radius: 100px;
}

/* DAY DETAIL VIEW */
#day-view { display: none; }
#day-view.active { display: block; }

.day-hero {
  background: var(--ink); padding: 20px 20px 16px;
}
.day-hero-num {
  font-size: 11px; color: var(--gold);
  text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px;
}
.day-hero-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px; color: white; font-weight: 700;
  line-height: 1.2;
}
.day-hero-date { font-size: 13px; color: rgba(255,255,255,.45); margin-top: 6px; }

.day-sections { padding: 16px 16px 100px; display: flex; flex-direction: column; gap: 20px; }

.section-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 2px; color: var(--smoke);
  font-weight: 500; margin-bottom: 10px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(26,18,8,.08);
}

.activity-card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(26,18,8,.07);
  border: 1px solid rgba(26,18,8,.05);
  margin-bottom: 10px;
}

.activity-img {
  width: 100%; height: 160px;
  object-fit: cover;
  background: var(--warm);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px;
  position: relative; overflow: hidden;
}
.activity-img img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.activity-img-emoji {
  width: 100%; height: 160px;
  background: linear-gradient(135deg, var(--warm) 0%, var(--paper) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 52px;
}

.activity-body { padding: 14px 16px; }

.activity-name {
  font-family: 'Playfair Display', serif;
  font-size: 17px; font-weight: 700;
  margin-bottom: 6px; line-height: 1.3;
}
.activity-desc { font-size: 13px; color: var(--smoke); line-height: 1.5; margin-bottom: 12px; }

.activity-meta {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.meta-chip {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 4px 10px; border-radius: 100px;
  font-weight: 500;
}
.chip-time { background: rgba(26,18,8,.06); color: var(--ink); }
.chip-price { background: rgba(212,168,67,.12); color: #8B6914; }
.chip-free { background: rgba(34,139,34,.1); color: #1a6b1a; }
.chip-transport { background: rgba(60,100,180,.1); color: #2a4fa0; }

.btn-maps {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  background: var(--ink); color: white;
  border: none; border-radius: 10px;
  padding: 11px; font-size: 13px; font-weight: 500;
  cursor: pointer; text-decoration: none;
  font-family: 'DM Sans', sans-serif;
  transition: background .2s;
}
.btn-maps:active { background: #333; }
.btn-maps-icon { font-size: 16px; }

/* TRANSPORT CARD */
.transport-card {
  background: rgba(26,18,8,.04);
  border-radius: 12px; padding: 14px 16px;
  border: 1px dashed rgba(26,18,8,.12);
  margin-bottom: 10px;
}
.transport-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.transport-detail { font-size: 12px; color: var(--smoke); line-height: 1.6; }

/* TIPS CARD */
.tips-card {
  background: linear-gradient(135deg, rgba(212,168,67,.08), rgba(212,168,67,.02));
  border: 1px solid rgba(212,168,67,.25);
  border-radius: 12px; padding: 14px 16px;
}
.tips-title { font-size: 12px; font-weight: 600; color: #8B6914; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.tips-list { font-size: 12px; color: var(--smoke); line-height: 1.7; }
.tips-list li { margin-left: 16px; }

/* CHECKLIST CARD */
.checklist-card {
  background: rgba(192,57,43,.04);
  border: 1px solid rgba(192,57,43,.15);
  border-radius: 12px; padding: 14px 16px;
}
.checklist-title { font-size: 12px; font-weight: 600; color: var(--red); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.checklist-item {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 12px; color: var(--smoke);
  padding: 4px 0; border-bottom: 1px solid rgba(26,18,8,.04);
  cursor: pointer; transition: opacity .2s;
}
.checklist-item:last-child { border-bottom: none; }
.check-box {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid rgba(192,57,43,.35);
  flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; transition: background .2s, border-color .2s;
}
.checklist-item.done .check-box { background: var(--red); border-color: var(--red); color: white; }
.checklist-item.done span { text-decoration: line-through; opacity: .5; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--ink);
  display: flex;
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1; padding: 14px 8px 12px;
  background: none; border: none;
  color: rgba(255,255,255,.4);
  font-size: 20px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: 'DM Sans', sans-serif;
  transition: color .2s;
}
.nav-btn span { font-size: 10px; letter-spacing: .3px; }
.nav-btn.active { color: var(--gold); }

/* CITY LIST VIEW */
#home-view { display: none; }
#home-view.active { display: block; }

.home-header {
  background: var(--ink); padding: 20px 20px 24px;
  position: relative; overflow: hidden;
}
.home-header::after {
  content: ''; position: absolute;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(192,57,43,.2) 0%, transparent 70%);
  top: -60px; right: -40px;
}
.home-subtitle { font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.home-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px; color: white; font-weight: 700;
}
.home-meta { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 6px; }

.cities-grid { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

.city-card {
  border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer; transition: transform .15s;
  position: relative; min-height: 100px;
  display: flex; align-items: flex-end;
  background: var(--ink);
}
.city-card:active { transform: scale(.985); }
.city-card-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: brightness(.5);
  transition: filter .3s;
}
.city-card:active .city-card-bg { filter: brightness(.4); }
.city-card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(26,18,8,.9) 0%, transparent 60%);
}
.city-card-content { position: relative; z-index: 1; padding: 16px; width: 100%; }
.city-card-emoji { font-size: 22px; margin-bottom: 4px; display: block; }
.city-card-name {
  font-family: 'Playfair Display', serif;
  font-size: 22px; color: white; font-weight: 700; line-height: 1;
}
.city-card-dates { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 4px; }
.city-card-days {
  position: absolute; top: 12px; right: 12px;
  background: rgba(212,168,67,.2);
  border: 1px solid rgba(212,168,67,.3);
  border-radius: 8px; padding: 4px 10px;
  font-size: 11px; color: var(--gold); font-weight: 600;
}

/* SEARCH */
.search-bar {
  padding: 12px 16px;
  background: var(--paper);
  position: sticky; top: 56px; z-index: 50;
  border-bottom: 1px solid rgba(26,18,8,.08);
}
.search-input {
  width: 100%;
  background: white; border: 1px solid rgba(26,18,8,.1);
  border-radius: 10px; padding: 10px 14px 10px 36px;
  font-size: 14px; font-family: 'DM Sans', sans-serif;
  outline: none; color: var(--ink);
  position: relative;
}
.search-wrap { position: relative; }
.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  font-size: 15px; color: var(--smoke); pointer-events: none;
}

/* INFO/PRACTICAL VIEW */
#info-view { display: none; }
#info-view.active { display: block; }

.info-header { background: var(--ink); padding: 20px 20px 24px; }
.info-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px; color: white; font-weight: 700;
}
.info-subtitle { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 4px; }

.info-sections { padding: 16px 16px 100px; }
.info-section { margin-bottom: 24px; }
.info-section-title {
  font-size: 12px; text-transform: uppercase;
  letter-spacing: 2px; color: var(--smoke);
  font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.info-section-title::after { content: ''; flex: 1; height: 1px; background: rgba(26,18,8,.08); }

.info-table {
  width: 100%; border-collapse: collapse;
  background: var(--card); border-radius: 12px;
  overflow: hidden; box-shadow: var(--shadow);
  font-size: 12px;
}
.info-table th {
  background: var(--ink); color: var(--gold);
  padding: 10px 12px; text-align: left;
  font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .5px;
}
.info-table td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(26,18,8,.05);
  vertical-align: top; color: var(--ink);
  line-height: 1.5;
}
.info-table tr:last-child td { border-bottom: none; }
.info-table tr:nth-child(even) td { background: rgba(26,18,8,.015); }

.app-item {
  background: var(--card); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 2px 8px rgba(26,18,8,.05);
}
.app-icon { font-size: 28px; flex-shrink: 0; }
.app-name { font-size: 14px; font-weight: 600; }
.app-desc { font-size: 11px; color: var(--smoke); margin-top: 2px; }
.app-badge {
  margin-left: auto; font-size: 10px; padding: 3px 8px;
  border-radius: 100px; font-weight: 600; flex-shrink: 0;
}
.badge-critical { background: rgba(192,57,43,.1); color: var(--red); }
.badge-useful { background: rgba(212,168,67,.12); color: #8B6914; }
.badge-optional { background: rgba(26,18,8,.06); color: var(--smoke); }

.warning-banner {
  background: rgba(192,57,43,.07);
  border: 1px solid rgba(192,57,43,.2);
  border-radius: 12px; padding: 14px 16px;
  margin-bottom: 12px;
  font-size: 13px; color: var(--ink);
  display: flex; gap: 10px; align-items: flex-start;
}
.warning-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

/* SCROLL */
::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }

/* TRANSITIONS */
.view-transition { animation: fadeSlide .25s ease-out; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* DIVIDER */
.section-divider {
  height: 1px; background: rgba(26,18,8,.08);
  margin: 4px 0 16px;
}

.tampon-banner {
  background: rgba(122,112,96,.07);
  border: 1px solid rgba(122,112,96,.15);
  border-radius: 12px; padding: 12px 16px;
  font-size: 12px; color: var(--smoke);
  margin-bottom: 12px; line-height: 1.6;
}
.tampon-banner strong { color: var(--ink); }

/* Safe area helpers */
.pb-safe { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>

<!-- ═══════════════ COVER ═══════════════ -->
<div id="cover">
  <div class="cover-pattern"></div>
  <div class="cover-circle"></div>
  <div class="cover-circle2"></div>
  <div class="cover-content">
    <span class="cover-flag">🐉</span>
    <div class="cover-eyebrow">Carnet de voyage</div>
    <h1 class="cover-title">Chine &amp;<br><span>Hong Kong</span></h1>
    <p class="cover-sub">8 – 27 novembre 2026 · 4 voyageurs</p>

    <div class="trip-stats">
      <div class="stat"><span class="stat-num">20</span><span class="stat-label">Jours</span></div>
      <div class="stat"><span class="stat-num">6</span><span class="stat-label">Villes</span></div>
      <div class="stat"><span class="stat-num">4</span><span class="stat-label">Voyageurs</span></div>
    </div>

    <div class="route-pills">
      <div class="pill"><span class="pill-dot"></span>Hong Kong</div>
      <div class="pill"><span class="pill-dot"></span>Chongqing</div>
      <div class="pill"><span class="pill-dot"></span>Xi'an</div>
      <div class="pill"><span class="pill-dot"></span>Beijing</div>
      <div class="pill"><span class="pill-dot"></span>Shanghai</div>
    </div>

    <button class="btn-start" onclick="openApp()">Ouvrir le carnet →</button>
  </div>
</div>

<!-- ═══════════════ APP SHELL ═══════════════ -->
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar" id="topbar">
    <button class="topbar-back" id="backBtn" onclick="goBack()">‹</button>
    <div>
      <div class="topbar-city" id="topbarCity">Voyage Chine</div>
      <div class="topbar-date" id="topbarDate">Nov 2026</div>
    </div>
  </div>

  <!-- ── HOME VIEW ── -->
  <div id="home-view">

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let currentView = 'home';
let currentCity = null;
let currentDay = null;
let checkedItems = JSON.parse(localStorage.getItem('checkedItems') || '{}');

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════

function openApp() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  renderHome();
  showView('home');
}

function showView(view) {
  ['home-view','city-view','day-view','info-view'].forEach(v => {
    document.getElementById(v).classList.remove('active');
  });
  ['nav-home','nav-info'].forEach(b => {
    document.getElementById(b) && document.getElementById(b).classList.remove('active');
  });

  currentView = view;
  const el = document.getElementById(view + '-view');
  if (el) { el.classList.add('active'); el.classList.add('view-transition'); }

  if (view === 'home') {
    document.getElementById('nav-home').classList.add('active');
    setTopbar('Voyage Chine 🐉', 'Nov 2026');
    document.getElementById('backBtn').style.opacity = '0';
  } else if (view === 'info') {
    document.getElementById('nav-info').classList.add('active');
    setTopbar('Infos pratiques', 'Transport & paiements');
    document.getElementById('backBtn').style.opacity = '0';
    renderInfo();
  } else {
    document.getElementById('backBtn').style.opacity = '1';
  }
}

function setTopbar(city, date) {
  document.getElementById('topbarCity').textContent = city;
  document.getElementById('topbarDate').textContent = date;
}

function goBack() {
  if (currentView === 'day-view') { openCity(currentCity.id); }
  else if (currentView === 'city-view') { showView('home'); }
  else { showView('home'); }
}

// ─── HOME ───
function renderHome() {
  const grid = document.getElementById('citiesGrid');
  grid.innerHTML = CITIES.map(c => `
    <div class="city-card" onclick="openCity('${c.id}')">
      <div class="city-card-bg" style="background-image:url('${c.bg}')"></div>
      <div class="city-card-overlay"></div>
      <div class="city-card-days">${c.daysLabel}</div>
      <div class="city-card-content">
        <span class="city-card-emoji">${c.emoji}</span>
        <div class="city-card-name">${c.name}</div>
        <div class="city-card-dates">${c.dates}</div>
      </div>
    </div>
  `).join('');
}

// ─── CITY ───
function openCity(cityId) {
  currentCity = CITIES.find(c => c.id === cityId);
  if (!currentCity) return;

  document.getElementById('cityBg').style.backgroundImage = `url('${currentCity.bg}')`;
  document.getElementById('cityEmoji').textContent = currentCity.emoji;
  document.getElementById('cityName').textContent = currentCity.name;
  document.getElementById('cityDates').textContent = currentCity.dates;

  const w = currentCity.weather;
  document.getElementById('cityWeather').innerHTML = `
    <div>
      <div class="weather-temp">${w.temp}</div>
      <div class="weather-desc">${w.desc}</div>
    </div>
    <div style="flex:1;border-left:1px solid rgba(255,255,255,.1);padding-left:16px;">
      <div class="weather-tips">👗 ${w.tips}</div>
      <div class="weather-tips" style="margin-top:4px;">🏨 Hôtel idéal : <strong style="color:var(--gold)">${currentCity.hotel.rec}</strong></div>
    </div>
  `;

  const list = document.getElementById('daysList');
  list.innerHTML = currentCity.days.map(dayId => {
    const d = DAYS[dayId];
    if (!d) return '';
    const tagClass = d.type === 'tampon' ? 'tag-tampon' : d.type === 'excursion' ? 'tag-excursion' : 'tag-visite';
    const tagLabel = d.type === 'tampon' ? '🔄 Tampon' : d.type === 'excursion' ? '🗺 Excursion' : '✨ Visite';
    const numClass = d.type === 'tampon' ? 'tampon' : '';
    return `
      <div class="day-card" onclick="openDay('${dayId}')">
        <div class="day-card-header">
          <div class="day-num ${numClass}">J${d.num}</div>
          <div class="day-card-info">
            <div class="day-card-title">${d.title}</div>
            <div class="day-card-meta">${d.date}</div>
          </div>
          <div class="day-card-tag ${tagClass}">${tagLabel}</div>
        </div>
        ${d.preview && d.preview.length ? `
        <div class="day-card-preview">
          ${d.preview.map(p => `<span class="preview-pill">${p}</span>`).join('')}
        </div>` : ''}
      </div>
    `;
  }).join('');

  setTopbar(currentCity.name, currentCity.dates);
  document.getElementById('backBtn').style.opacity = '1';
  showView('city');
}

// ─── DAY ───
function openDay(dayId) {
  const d = DAYS[dayId];
  if (!d) return;
  currentDay = d;

  document.getElementById('dayHeroNum').textContent = `Jour ${d.num} — ${currentCity ? currentCity.name : ''}`;
  document.getElementById('dayHeroTitle').textContent = d.title;
  document.getElementById('dayHeroDate').textContent = d.date;

  const container = document.getElementById('daySections');
  let html = '';

  if (d.tamponNote) {
    html += `<div class="tampon-banner">⏳ <strong>Jour tampon :</strong> ${d.tamponNote}</div>`;
  }

  if (!d.sections || d.sections.length === 0) {
    html += `<div style="text-align:center;padding:40px 20px;color:var(--smoke);font-size:14px;">Voir le jour précédent pour le détail de transport et arrivée.</div>`;
  }

  d.sections.forEach(section => {
    html += `<div>
      <div class="section-label">${section.time}</div>`;

    section.activities.forEach(act => {
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(act.maps || act.name)}`;
      html += `
        <div class="activity-card">
          <div class="activity-img-emoji">${act.emoji || '📍'}</div>
          <div class="activity-body">
            <div class="activity-name">${act.name}</div>
            <div class="activity-desc">${act.desc}</div>
            <div class="activity-meta">
              ${act.duration ? `<span class="meta-chip chip-time">⏱ ${act.duration}</span>` : ''}
              ${act.price ? `<span class="meta-chip ${act.price.toLowerCase().includes('gratuit') || act.price.toLowerCase().includes('free') ? 'chip-free' : 'chip-price'}">
                ${act.price.toLowerCase().includes('gratuit') || act.price.toLowerCase().includes('free') ? '🆓' : '💰'} ${act.price}
              </span>` : ''}
            </div>
            ${act.tips ? `<div class="transport-card"><div class="transport-title">💡 Conseil</div><div class="transport-detail">${act.tips}</div></div>` : ''}
            <a class="btn-maps" href="${mapsUrl}" target="_blank" rel="noopener">
              <span class="btn-maps-icon">📍</span> Ouvrir dans Google Maps
            </a>
          </div>
        </div>`;
    });
    html += '</div>';
  });

  if (d.checklist && d.checklist.length) {
    html += `<div class="checklist-card">
      <div class="checklist-title">✅ Check-list du jour</div>
      ${d.checklist.map((item, i) => {
        const key = `${dayId}-${i}`;
        const done = checkedItems[key];
        return `<div class="checklist-item ${done ? 'done' : ''}" onclick="toggleCheck('${dayId}', ${i})">
          <div class="check-box">${done ? '✓' : ''}</div>
          <span>${item}</span>
        </div>`;
      }).join('')}
    </div>`;
  }

  container.innerHTML = html;
  setTopbar(d.title, `Jour ${d.num}`);
  document.getElementById('backBtn').style.opacity = '1';
  showView('day');
}

function toggleCheck(dayId, idx) {
  const key = `${dayId}-${idx}`;
  checkedItems[key] = !checkedItems[key];
  localStorage.setItem('checkedItems', JSON.stringify(checkedItems));
  openDay(dayId);
}
